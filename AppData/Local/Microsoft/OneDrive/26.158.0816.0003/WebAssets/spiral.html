<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Spiral</title><script src="//photosapi.od4/api/od4context.js"></script><script src="/static/platform/strings.js"></script><script src="/static/shared/numeric-utilities.js"></script><script src="/static/shared/file-dimensions.js"></script><script src="/static/platform/od4-telemetry.js"></script><script src="/static/platform/od4-telemetry-photos.js"></script><script src="/static/platform/od4-spo-fallback.js"></script><script src="/static/platform/od4-fetch.js"></script><script src="/static/platform/drop-bridge.js"></script><script src="/static/platform/ecs.js"></script><script src="/static/view-lib/sql.js"></script><script src="/static/shared/date-format.js"></script><link rel="stylesheet" href="/static/tokens/motion.css"><link rel="stylesheet" href="/static/tokens/scrollbar.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#111;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;overflow:hidden;width:100vw;height:100vh}#canvas{display:block;width:100%;height:100%;cursor:grab}#canvas.grabbing{cursor:grabbing}#loading{position:fixed;top:60%;left:50%;transform:translate(-50%,-50%);font-size:var(--font-size-body-2-stronger);transition:opacity .8s}#loading.hidden{opacity:0;pointer-events:none}#controls{position:fixed;bottom:20px;right:20px;background:rgba(30,30,30,.95);border:1px solid #444;border-radius:8px;padding:16px;min-width:250px;transition:all .3s}#controls.collapsed{padding:8px 12px;min-width:auto}#controls.collapsed .control-content{display:none}.control-group{margin-bottom:14px}.control-group:last-child{margin-bottom:0}.control-label{display:block;font-size:12px;color:#aaa;margin-bottom:6px}.control-value{float:right;color:#7b9dff}input[type=range]{width:100%;height:4px;background:#444;outline:0;border-radius:2px;-webkit-appearance:none}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;background:#7b9dff;cursor:pointer;border-radius:50%}input[type=range]::-moz-range-thumb{width:14px;height:14px;background:#7b9dff;cursor:pointer;border-radius:50%;border:none}button{width:100%;padding:8px 12px;background:#333;color:#e0e0e0;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:var(--font-size-caption-1);font-family:inherit;transition:background .2s}button:hover{background:#444}#toggleBtn{margin-bottom:12px}#controls.collapsed #toggleBtn{margin-bottom:0}</style><script src="/static/view-lib/theme-sync.js"></script><script src="/static/view-lib/user-activity.js"></script><script>ViewLib.ThemeSync.applyDirFromParent()</script></head><body><canvas id="canvas"></canvas><div id="loading">Loading photos...</div><div id="controls"><button id="toggleBtn">Hide Controls</button><div class="control-content"><div class="control-group"><label class="control-label">Max Photo Size <span class="control-value" id="maxSizeValue">90</span></label> <input type="range" id="maxSize" min="40" max="150" value="90"></div><div class="control-group"><label class="control-label">Min Photo Size <span class="control-value" id="minSizeValue">25</span></label> <input type="range" id="minSize" min="10" max="60" value="25"></div><div class="control-group"><label class="control-label">Spiral Spacing <span class="control-value" id="spacingValue">0.40</span></label> <input type="range" id="spacing" min="0.2" max="1.0" step="0.05" value="0.4"></div><div class="control-group"><button id="resetBtn">Reset View</button></div></div></div><script src="/static/platform/icon.js"></script><script src="/static/view-lib/thumbnail.js"></script><script src="/static/view-lib/thumbnail-resolve.js"></script><script src="/static/views/spiral.js"></script></body></html>
