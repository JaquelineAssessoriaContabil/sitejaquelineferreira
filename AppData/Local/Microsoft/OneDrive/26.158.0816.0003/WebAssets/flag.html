<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Flag</title><script src="//photosapi.od4/api/od4context.js"></script><script src="/static/shared/numeric-utilities.js"></script><script src="/static/shared/file-dimensions.js"></script><script src="/static/platform/od4-telemetry.js"></script><script src="/static/platform/od4-telemetry-photos.js"></script><script src="/static/platform/od4-spo-fallback.js"></script><script src="/static/platform/od4-fetch.js"></script><script src="/static/platform/drop-bridge.js"></script><script src="/static/view-lib/theme-sync.js"></script><script src="/static/view-lib/user-activity.js"></script><script>ViewLib.ThemeSync.setupFullThemeSync()</script><link rel="stylesheet" href="/static/tokens/motion.css"><link rel="stylesheet" href="/static/tokens/scrollbar.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#111;overflow:hidden;height:100vh}canvas{display:block}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;color:#888;font-size:14px;z-index:20;transition:opacity .6s}#loading.hidden{opacity:0;pointer-events:none}.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;z-index:10;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.ctrl-group{display:flex;align-items:center;gap:6px}.ctrl-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#555}.ctrl-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);border-radius:6px;cursor:pointer;transition:background .15s,color .15s;padding:5px 10px;font-size:12px;font-family:inherit;line-height:1}.ctrl-btn:hover{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}.ctrl-btn.gust{color:#f80;border-color:rgba(255,136,0,.3)}.ctrl-btn.gust:hover{background:rgba(255,136,0,.15)}.ctrl-sep{width:1px;height:24px;background:rgba(255,255,255,.08)}.ctrl-value{font-size:14px;color:#7b9dff;font-weight:600;min-width:16px;text-align:center}.ctrl-hint{font-size:10px;color:#444}</style></head><body><div id="loading">Loading photos...</div><canvas id="c"></canvas><div class="controls"><div class="ctrl-group"><span class="ctrl-label">Wind</span> <button class="ctrl-btn" id="windDown">&minus;</button> <span class="ctrl-value" id="windEl">3</span> <button class="ctrl-btn" id="windUp">+</button></div><div class="ctrl-sep"></div><button class="ctrl-btn gust" id="gustBtn">Gust!</button><div class="ctrl-sep"></div><span class="ctrl-hint">Drag the cloth with your mouse</span></div><script src="/static/views/flag.js"></script></body></html>
