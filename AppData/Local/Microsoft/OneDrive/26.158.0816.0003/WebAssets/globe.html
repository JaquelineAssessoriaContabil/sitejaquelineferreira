rder-radius:50%;background:#e0e0e0;cursor:pointer}.control-group input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#e0e0e0;cursor:pointer;border:none}.control-group .value{display:inline-block;float:right;font-size:var(--font-size-caption-1);color:#e0e0e0}.toggle-btn{position:fixed;bottom:20px;right:20px;background:rgba(20,20,20,.9);border:1px solid rgba(255,255,255,.1);border-radius:50%;width:48px;height:48px;color:#e0e0e0;font-size:24px;cursor:pointer;z-index:51;display:none;align-items:center;justify-content:center}.toggle-btn.visible{display:flex}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;cursor:pointer}.modal.visible{display:flex}.modal img{max-width:90%;max-height:90%;object-fit:contain;border:2px solid rgba(255,255,255,.3)}.photo-count{position:fixed;top:20px;left:20px;font-size:14px;color:#b0b0b0;z-index:10}</style><script src="/static/view-lib/theme-sync.js"></script><script src="/static/view-lib/user-activity.js"></script><script>ViewLib.ThemeSync.applyDirFromParent()</script></head><body><canvas id="globe"></canvas><div class="loading" id="loading">Loading photos...</div><div class="photo-count" id="photoCount">0 photos</div><div class="controls" id="controls"><h3>Controls</h3><div class="control-group"><label>Photo Size <span class="value" id="sizeValue">60</span></label> <input type="range" id="photoSize" min="30" max="100" value="60"></div><div class="control-group"><label>Rotation Speed <span class="value" id="speedValue">3</span></label> <input type="range" id="rotationSpeed" min="0" max="10" value="3" step="0.5"></div></div><div class="toggle-btn" id="toggleBtn">⚙</div><div class="modal" id="modal"><img id="modalImg" src="" alt="Photo"></div><script src="/static/platform/icon.js"></script><script src="/static/view-lib/thumbnail.js"></script><script src="/static/view-lib/thumbnail-resolve.js"></script><script src="/static/views/globe-rendering.js"></script></body></html>
