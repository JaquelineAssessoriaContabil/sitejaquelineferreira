<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darkroom</title><script src="//photosapi.od4/api/od4context.js"></script><script src="/static/shared/numeric-utilities.js"></script><script src="/static/shared/file-dimensions.js"></script><script src="/static/platform/od4-telemetry.js"></script><script src="/static/platform/od4-telemetry-photos.js"></script><script src="/static/platform/od4-spo-fallback.js"></script><script src="/static/platform/od4-fetch.js"></script><script src="/static/platform/drop-bridge.js"></script><script src="/static/platform/ecs.js"></script><script src="/static/view-lib/sql.js"></script><link rel="stylesheet" href="/static/tokens/motion.css"><link rel="stylesheet" href="/static/tokens/scrollbar.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0808;overflow:hidden}canvas{display:block}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0808;color:#844;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;z-index:10;transition:opacity .6s}#loading.hidden{opacity:0;pointer-events:none}#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20;cursor:pointer}#lightbox.active{display:flex}#lightbox img{max-width:85vw;max-height:85vh;border:10px solid #f0ece4;box-shadow:0 0 80px rgba(80,20,20,.4)}.controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;z-index:15;user-select:none}.ctrl-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);border-radius:6px;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;transition:background .15s,color .15s;display:flex;align-items:center;justify-content:center}.ctrl-btn:hover{background:rgba(255,255,255,.14);color:rgba(255,255,255,.8)}.ctrl-btn:active{background:rgba(255,255,255,.2)}.arrow-btn{width:40px;height:40px;font-size:var(--font-size-body-2-stronger)}.action-btn{height:40px;padding:0 14px;font-size:12px;letter-spacing:.5px;gap:5px}.page-info{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:var(--font-size-caption-2);color:rgba(255,255,255,.3);min-width:70px;text-align:center;padding:0 8px}.ctrl-kbd{font-size:var(--font-size-caption-2);color:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.1);border-radius:3px;padding:1px 4px}.ctrl-sep{width:1px;height:24px;background:rgba(255,255,255,.12);margin:0 4px}</style><script src="/static/view-lib/theme-sync.js"></script><script src="/static/view-lib/user-activity.js"></script><script>ViewLib.ThemeSync.applyDirFromParent()</script></head><body><div id="loading">Loading photos...</div><canvas id="canvas"></canvas><div id="lightbox"><img id="lightbox-img" src="" alt=""></div><div class="controls"><button class="ctrl-btn arrow-btn" id="prevBtn" title="Previous (Left arrow)">&#8249;</button> <span class="page-info" id="pageInfo"></span> <button class="ctrl-btn arrow-btn" id="nextBtn" title="Next (Right arrow)">&#8250;</button> <span class="ctrl-sep"></span> <button class="ctrl-btn action-btn" id="shuffleBtn" title="Shuffle (R)"><span>Shuffle</span> <span class="ctrl-kbd">R</span></button> <button class="ctrl-btn action-btn" id="developBtn" title="Re-develop (D)"><span>Develop</span> <span class="ctrl-kbd">D</span></button></div><script src="/static/platform/icon.js"></script><script src="/static/view-lib/thumbnail.js"></script><script src="/static/view-lib/thumbnail-resolve.js"></script><script src="/static/views/darkroom.js"></script></body></html>
