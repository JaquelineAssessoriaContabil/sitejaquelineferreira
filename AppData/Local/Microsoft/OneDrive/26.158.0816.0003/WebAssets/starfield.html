<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Field</title><script src="//photosapi.od4/api/od4context.js"></script><script src="/static/shared/numeric-utilities.js"></script><script src="/static/shared/file-dimensions.js"></script><script src="/static/platform/od4-telemetry.js"></script><script src="/static/platform/od4-telemetry-photos.js"></script><script src="/static/platform/od4-spo-fallback.js"></script><script src="/static/platform/od4-fetch.js"></script><script src="/static/platform/drop-bridge.js"></script><script src="/static/platform/ecs.js"></script><script src="/static/view-lib/sql.js"></script><link rel="stylesheet" href="/static/tokens/motion.css"><link rel="stylesheet" href="/static/tokens/scrollbar.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden}canvas{display:block}.controls{position:fixed;bottom:20px;right:20px;z-index:10;user-select:none}.controls-toggle{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);border-radius:6px;padding:6px 12px;font-size:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;cursor:pointer;transition:background .15s,color .15s}.controls-toggle:hover{background:rgba(255,255,255,.14);color:rgba(255,255,255,.8)}.controls-panel{background:rgba(10,10,10,.85);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:16px;margin-bottom:8px;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:12px;min-width:220px}.controls-panel.hidden{display:none}.control-row{display:flex;flex-direction:column;gap:4px}.control-label{display:flex;justify-content:space-between;font-size:var(--font-size-caption-2);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:rgba(255,255,255,.5)}.control-value{color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.12);outline:0}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#7b9dff;cursor:pointer}.pause-hint{font-size:10px;color:rgba(255,255,255,.3);text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#888;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;z-index:20;transition:opacity .8s}#loading.hidden{opacity:0;pointer-events:none}</style><script src="/static/view-lib/theme-sync.js"></script><script src="/static/view-lib/user-activity.js"></script><script>ViewLib.ThemeSync.applyDirFromParent()</script></head><body><canvas id="c"></canvas><div id="loading">Loading photos...</div><div class="controls"><div class="controls-panel" id="panel"><div class="control-row"><div class="control-label"><span>Crawl Speed</span> <span class="control-value" id="speed-val">120</span></div><input type="range" id="speed" min="20" max="500" value="120"></div><div class="control-row"><div class="control-label"><span>Min Photo Size</span> <span class="control-value" id="min-size-val">80</span></div><input type="range" id="min-size" min="30" max="300" value="80"></div><div class="control-row"><div class="control-label"><span>Max Photo Size</span> <span class="control-value" id="max-size-val">260</span></div><input type="range" id="max-size" min="60" max="500" value="260"></div><div class="control-row"><div class="control-label"><span>Star Speed</span> <span class="control-value" id="star-speed-val">1.0</span></div><input type="range" id="star-speed" min="0" max="30" value="10" step="1"></div><div class="control-row"><div class="control-label"><span>Star Count</span> <span class="control-value" id="star-count-val">2000</span></div><input type="range" id="star-count" min="200" max="6000" value="2000" step="100"></div><div class="control-row"><div class="control-label"><span>Photo Count</span> <span class="control-value" id="count-val">50</span></div><input type="range" id="photo-count" min="10" max="120" value="50"></div><div class="control-row"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="frames-toggle"> <span style="font-size:var(--font-size-caption-2);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:rgba(255,255,255,.5)">Picture Frames</span></label></div><div class="pause-hint">Space to pause</div></div><button class="controls-toggle" id="toggle-btn">Controls</button></div><script src="/static/platform/icon.js"></script><script src="/static/view-lib/thumbnail.js"></script><script src="/static/view-lib/thumbnail-resolve.js"></script><script src="/static/views/starfield-canvas-path.js"></script><script src="/static/views/starfield.js"></script></body></html>
