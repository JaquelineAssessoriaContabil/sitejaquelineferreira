<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photomosaic</title><script src="/static/view-lib/theme-sync.js"></script><script src="/static/view-lib/user-activity.js"></script><script>ViewLib.ThemeSync.setupFullThemeSync()</script><link rel="stylesheet" href="/static/tokens/theme.css"><link rel="stylesheet" href="/static/tokens/theme-forced-colors.css"><link rel="stylesheet" href="/static/tokens/typography.css"><link rel="stylesheet" href="/static/tokens/theme-overrides.css"><link rel="stylesheet" href="/static/tokens/layout.css"><link rel="stylesheet" href="/static/tokens/fluent-icon.css"><link rel="stylesheet" href="/static/tokens/persona-theme.css"><link rel="stylesheet" href="/static/tokens/motion.css"><link rel="stylesheet" href="/static/tokens/scrollbar.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg-neutral-1-rest);color:var(--fg-neutral-1-rest);font-family:var(--font-family-base, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif);overflow:hidden;width:100vw;height:100vh}#canvas{display:block;width:100%;height:100%;cursor:grab}#canvas.grabbing{cursor:grabbing}#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg-neutral-3-rest);color:var(--fg-neutral-1-rest);padding:2rem 3rem;border-radius:8px;font-size:1.2rem;text-align:center;z-index:1000}#loading.hidden{display:none}#hero-info{position:fixed;top:1rem;left:1rem;background:var(--bg-neutral-3-rest);border:1px solid var(--stroke-neutral-2-rest);color:var(--fg-neutral-1-rest);padding:.75rem 1rem;border-radius:6px;font-size:.9rem;max-width:300px;z-index:100}#hero-info .label{opacity:.7;font-size:.8rem;margin-bottom:.25rem}#controls{position:fixed;bottom:1rem;right:1rem;background:var(--bg-neutral-3-rest);border:1px solid var(--stroke-neutral-2-rest);color:var(--fg-neutral-1-rest);padding:1rem;border-radius:8px;min-width:250px;z-index:100;transition:transform .3s ease}#controls.collapsed{transform:translateX(calc(100% + 1rem))}#toggle-controls{position:fixed;bottom:1rem;right:1rem;background:var(--bg-neutral-3-rest);border:1px solid var(--stroke-neutral-2-rest);color:var(--fg-neutral-1-rest);padding:.75rem 1rem;border-radius:8px;cursor:pointer;font-size:1rem;z-index:99;transition:opacity .3s ease}#toggle-controls:hover{background:var(--bg-neutral-3-rest)}#controls.collapsed~#toggle-controls{opacity:1}#controls:not(.collapsed)~#toggle-controls{opacity:0;pointer-events:none}.control-group{margin-bottom:1rem}.control-group:last-child{margin-bottom:0}.control-group label{display:block;margin-bottom:.5rem;font-size:.9rem;opacity:.9}.control-group input[type=range]{width:100%;margin-bottom:.25rem}.control-group .value-display{font-size:.85rem;opacity:.7;text-align:right}button{background:var(--bg-neutral-3-rest);border:1px solid var(--stroke-neutral-2-rest);color:var(--fg-neutral-1-rest);padding:.6rem 1rem;border-radius:6px;cursor:pointer;font-size:.9rem;width:100%;transition:background .2s ease}button:hover{background:var(--bg-neutral-4-rest,#333)}button:active{background:var(--bg-neutral-2-rest)}.close-btn{position:absolute;top:.5rem;right:.5rem;width:auto;padding:.25rem .5rem;font-size:.8rem;background:0 0;border:none;opacity:.6}.close-btn:hover{opacity:1;background:var(--bg-neutral-2-rest)}input[type=range]{-webkit-appearance:none;appearance:none;background:var(--stroke-neutral-2-rest);outline:0;border-radius:3px;height:6px}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;background:var(--fg-brand-1-rest,#7b9dff);cursor:pointer;border-radius:50%}input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--fg-brand-1-rest,#7b9dff);cursor:pointer;border-radius:50%;border:none}</style></head><body><canvas id="canvas"></canvas><div id="loading">Loading photos...</div><div id="hero-info"><div class="label">Hero Photo</div><div id="hero-name">-</div><
