<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard DP - VEDI OPTICA</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #f7f1f0; /* Rosé suave da sua marca */
            color: #4a4a4a; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Papel de parede sutil da sua marca ao fundo */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vh; 
            height: 75vh;
            background-image: url('Jaqueline do Prado Ferreira - PNG-28.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.08; 
            z-index: 0; 
            pointer-events: none; 
        }

        /* CONTAINER QUE DIVIDE EM DUAS COLUNAS */
        .wrapper {
            display: flex;
            gap: 25px;
            width: 100%;
            max-width: 1450px;
            position: relative;
            z-index: 1;
        }

        /* 📁 BARRA LATERAL ESQUERDA PARA OS ARQUIVOS PDF */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(189, 154, 95, 0.06);
            border-top: 4px solid #bd9a5f; /* Dourado JF */
            flex-shrink: 0;
            align-self: flex-start;
        }
        
        .sidebar-title {
            font-size: 14px;
            font-weight: 700;
            color: #333333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }
        
        .sidebar-section {
            margin-bottom: 20px;
        }
        .sidebar-section:last-child { margin-bottom: 0; }
        
        .sidebar-subtitle {
            font-size: 11px;
            font-weight: 700;
            color: #bd9a5f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #f2eceb;
        }
        
        .pdf-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .btn-sidebar-pdf {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #555555;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            padding: 8px 10px;
            border-radius: 6px;
            transition: all 0.2s ease;
            line-height: 1.4;
        }
        .btn-sidebar-pdf:hover {
            background-color: #fbf7f6;
            color: #bd9a5f;
            padding-left: 14px;
        }

        /* 📊 PAINEL ORIGINAL DA IMAGEM ALINHADO À DIREITA */
        .main-panel { 
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(5px);
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(189, 154, 95, 0.06);
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #bd9a5f; 
            padding-bottom: 20px; 
            margin-bottom: 25px; 
        }
        .header h1 { font-size: 20px; color: #333333; font-weight: 600; letter-spacing: -0.3px; }
        .header p { font-size: 13px; color: #8c8c8c; margin-top: 3px; font-weight: 500; }
        
        .header-logo img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        
        .section-title { font-size: 15px; font-weight: 600; color: #333333; margin: 25px 0 12px 0; display: flex; align-items: center; gap: 8px; border-left: 4px solid #bd9a5f; padding-left: 10px; }
        
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: white; border: 1px solid #f2eceb; border-radius: 8px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.01); border-top: 4px solid #bd9a5f; }
        
        /* Cores das barrinhas laterais de KPI */
        .card.folha { border-left: 5px solid #C58A94; border-top: none; }
        .card.encargos { border-left: 5px solid #bd9a5f; border-top: none; }
        .card.liquido { border-left: 5px solid #8B5CF6; border-top: none; }
        .card.empregados { border-left: 5px solid #6366F1; border-top: none; }
        .card.contribuintes { border-left: 5px solid #10B981; border-top: none; }

        .card-label { font-size: 11px; text-transform: uppercase; color: #8c8c8c; font-weight: 600; }
        .card-value { font-size: 22px; font-weight: 700; color: #333333; margin: 6px 0 2px 0; }
        .card-sub { font-size: 12px; color: #7a7a7a; }

        /* PAINEL DOS BOTÕES PIX */
        .panel { background: white; border: 1px solid #E5E7EB; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
        .panel-title { font-size: 15px; font-weight: 600; color: #111827; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .competencia-badge { background: #FEF3C7; color: #92400E; padding: 4px 12px; border-radius: 16px; font-size: 11px; font-weight: 600; }
        .payment-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
        .payment-item { border: 1px solid #E5E7EB; border-radius: 6px; padding: 16px; background: #F9FAFB; }
        .payment-type { font-size: 13px; color: #6B7280; font-weight: 600; margin-bottom: 12px; }
        .payment-value { font-size: 24px; font-weight: 700; color: #111827; margin-bottom: 8px; }
        .payment-info { font-size: 12px; color: #6B7280; margin-bottom: 10px; line-height: 1.4; }
        .payment-code { font-size: 11px; background: #F3F4F6; padding: 8px; border-radius: 4px; color: #374151; margin-bottom: 12px; word-break: break-all; font-family: monospace; }
        .btn-copy { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
        .btn-copy.inss { background: #bd9a5f; color: white; }
        .btn-copy.inss:hover { background: #a3824b; }
        .btn-copy.fgts { background: #C5A059; color: white; }
        .btn-copy.fgts:hover { background: #B89146; }

        /* GRÁFICOS */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .chart-container { background: white; border: 1px solid #E5E7EB; border-radius: 8px; padding: 20px; position: relative; height: 280px; }
        .chart-title { font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 12px; }
        canvas { max-height: 240px; }

        /* TABELAS */
        .table-container { background: white; border: 1px solid #E5E7EB; border-radius: 8px; padding: 20px; margin-bottom: 24px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead { background: #F9FAFB; border-bottom: 2px solid #E5E7EB; }
        th { padding: 12px; text-align: left; font-weight: 600; color: #111827; }
        td { padding: 12px; border-bottom: 1px solid #E5E7EB; }
        tbody tr:hover { background: #F9FAFB; }
        .text-right { text-align: right; }

        /* CERTIDÕES */
        .certidoes-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
        .cert-card { background: white; border: 1px solid #E5E7EB; border-radius: 6px; padding: 14px; text-align: center; }
        .cert-icon { font-size: 24px; margin-bottom: 6px; }
        .cert-label { font-size: 11px; font-weight: 600; color: #111827; }
        .cert-status { font-size: 10px; color: #10B981; margin-top: 4px; font-weight: 600; }
        
        /* BOTÃO VOLTAR */
        .btn-back { 
            display: inline-block; 
            margin-top: 30px; 
            text-decoration: none; 
            background-color: #bd9a5f; 
            color: white; 
            padding: 12px 22px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            transition: all 0.2s ease; 
            box-shadow: 0 4px 12px rgba(189, 154, 95, 0.15);
        }
        .btn-back:hover { background-color: #a3824b; transform: translateY(-2px); }

        @media (max-width: 1150px) {
            .wrapper { flex-direction: column; }
            .sidebar { width: 100%; }
            .kpis-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            .kpis-grid { grid-template-columns: 1fr; }
            .certidoes-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="wrapper">

    <!-- 📁 BARRA LATERAL ESQUERDA - TODOS OS ARQUIVOS PDF -->
    <div class="sidebar">
        <div class="sidebar-title">📁 Arquivos em PDF</div>
        
        <div class="sidebar-section">
            <div class="sidebar-subtitle">Encargos Sociais</div>
            <div class="pdf-list">
