<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Fiscal - 📊 MACAIA GESTAO LTDA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
            border-left: 4px solid #C58A94;
        }

        .header-info h1 {
            font-size: 22px;
            color: #C58A94;
            margin-bottom: 8px;
        }

        .header-info p {
            color: #666;
            font-size: 13px;
            margin: 4px 0;
        }

        .dashboard-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 11px;
            margin-top: 20px;
        }

</head>

    <div class="container">

        <div class="dashboard-container">

        </div>

        <div class="footer">
            <p><strong>Jaqueline Ferreira Assessoria Contábil</strong> | CRC SC-013019/O-4</p>
            <p>Videira - SC | contato@jaquelineferreiracontadora.com.br</p>
